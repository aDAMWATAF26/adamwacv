<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheese Game</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #065f46, #10b981);

<body>

<h1>🧀 Cheese Game</h1>

<p>Time: <span id="timer">60</span></p>
<p>Score: <span id="score">0</span></p>

<div id="leaderboard">
    <h2>🏆 Global Top 5</h2>
    <ol id="leaderList"></ol>
    <div id="leaderStatus">Loading scores...</div>
</div>

<button id="cheese" onclick="eatCheese()">🧀</button>

<div id="messageBox">
    <h2>⏰ Time's Up!</h2>
    <p>Your Score: <span id="finalScore">0</span></p>
    <input id="playerName" maxlength="25"
           placeholder="Enter your name">
    <br><br>
    <button id="saveBtn" onclick="saveScore()">Save Score</button>
    <button id="playAgainBtn" onclick="playAgain()">🔁 Play Again</button>
    <a href="index.html" id="backBtn">⬅ Back</a>
    <p id="saveStatus" role="status"></p>
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const SUPABASE_URL =
    "https://qjgwkvrtmlqdqwehzlfe.supabase.co";

const SUPABASE_KEY =
    "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

const SCORES_URL =
    SUPABASE_URL + "/rest/v1/cheese_scores";

let score = 0;
let timeLeft = 60;
let musicStarted = false;
let gameOver = false;
let scoreSaved = false;

const cheese = document.getElementById("cheese");
const music = document.getElementById("music");

async function supabaseRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            ...options.headers
        }
    });

    if (!response.ok) {
        const errorText = await response.text();
        throw new Error("Supabase error " +
            response.status + ": " + errorText);
    }

    if (response.status === 204) return null;

    const text = await response.text();
    return text ? JSON.parse(text) : null;
}

async function showLeaderboard() {
    const list = document.getElementById("leaderList");
    const status = document.getElementById("leaderStatus");

    status.textContent = "Loading scores...";

    try {
        const url = SCORES_URL +
            "?select=player_name,score,created_at" +
            "&order=score.desc,created_at.asc" +
            "&limit=5";

        const players = await supabaseRequest(url);

        list.replaceChildren();

        players.forEach(function(player) {
            const li = document.createElement("li");
            li.textContent = player.player_name +
                " - " + player.score;
            list.appendChild(li);
        });

        if (players.length === 0) {
            status.textContent = "No scores yet. Be the first!";
        } else {
            status.textContent = "Live global leaderboard";
        }
    } catch (error) {
        console.error(error);
        status.textContent =
            "Could not load scores. Check connection and policies.";
    }
}

showLeaderboard();

const timerInterval = setInterval(function() {
    if (timeLeft > 0) timeLeft--;

    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(timerInterval);
        gameOver = true;
        cheese.style.display = "none";

        document.getElementById("finalScore").textContent = score;
        document.getElementById("messageBox").style.display = "block";
    }
}, 1000);

function eatCheese() {
    if (gameOver) return;

    if (!musicStarted) {
        music.play().catch(function(error) {
            console.log("Music could not autoplay:", error);
        });
        musicStarted = true;
    }

    score++;
    document.getElementById("score").textContent = score;

    const maxX = Math.max(0, window.innerWidth - cheese.offsetWidth);
    const maxY = Math.max(80, window.innerHeight - cheese.offsetHeight);

    cheese.style.left = Math.random() * maxX + "px";
    cheese.style.top =
        (80 + Math.random() * Math.max(0, maxY - 80)) + "px";
    cheese.style.transform = "none";
}

async function saveScore() {
    if (scoreSaved) return;

    const nameInput = document.getElementById("playerName");
    const saveButton = document.getElementById("saveBtn");
    const status = document.getElementById("saveStatus");

    const name = nameInput.value.trim() || "Customer";

    if (SUPABASE_KEY === "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE") {
        status.textContent = "Add your publishable key in the code first.";
        return;
    }

    saveButton.disabled = true;
    status.textContent = "Saving your score...";

    try {
        await supabaseRequest(SCORES_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify({
                player_name: name.slice(0, 25),
                score: score
            })
        });

        scoreSaved = true;
        status.textContent = "Score saved! 🏆";
        saveButton.textContent = "Score Saved";

        await showLeaderboard();
    } catch (error) {
        console.error(error);
        status.textContent =
            "Could not save score. Please try again.";
        saveButton.disabled = false;
    }
}

function playAgain() {
    location.reload();
}
</script>

</body>
</html>
