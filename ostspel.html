<body>

<h1>🧀 Cheese Game</h1>

<p>Time: <span id="timer">60</span></p>
<p>Score: <span id="score">0</span></p>

<div id="leaderboard">
    <h2>🏆 Global Top 5</h2>
    <ol id="leaderList"></ol>
    <div id="leaderStatus">Connecting...</div>
</div>

<button id="cheese" aria-label="Eat cheese"
        onclick="eatCheese()">🧀</button>

<div id="messageBox">
    <h2>⏰ Time's Up!</h2>
    <p>Your Score: <span id="finalScore">0</span></p>
    <input id="playerName" maxlength="25"
           placeholder="Enter your name"
           autocomplete="nickname">
    <br><br>
    <button id="saveBtn" onclick="saveScore()">Save Score</button>
    <button id="playAgainBtn" onclick="playAgain()">🔁 Play Again</button>
    <a href="index.html" id="backBtn">⬅ Back</a>
    <p id="saveStatus" role="status"></p>
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const SUPABASE_URL =
    "https://qjgwkvrtmlqdqwehzlfe.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_4sQgHCAuVRcxgRdOmzySHA_vbXzfWRC";

const SCORES_URL = SUPABASE_URL + "/rest/v1/cheese_scores";

let score = 0;
let timeLeft = 60;
let musicStarted = false;
let gameOver = false;
let scoreSaved = false;

const cheese = document.getElementById("cheese");
const music = document.getElementById("music");

async function dbRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            ...options.headers
        }
    });

    if (!response.ok) {
        const details = await response.text();
        throw new Error("HTTP " + response.status + ": " + details);
    }

    if (response.status === 204) return null;

    const text = await response.text();
    return text ? JSON.parse(text) : null;
}

async function showLeaderboard() {
    const list = document.getElementById("leaderList");
    const status = document.getElementById("leaderStatus");

    try {
        const query = SCORES_URL +
            "?select=player_name,score,created_at" +
            "&order=score.desc,created_at.asc" +
            "&limit=5";

        const players = await dbRequest(query);

        list.replaceChildren();

        players.forEach(function(player) {
            const item = document.createElement("li");
            item.textContent = player.player_name + " - " + player.score;
            list.appendChild(item);
        });

        status.textContent = players.length
            ? "🌍 Global leaderboard"
            : "No scores yet. Be first!";
    } catch (error) {
        console.error("Leaderboard error:", error);
        status.textContent = "Couldn't load scores. Check database setup.";
    }
}

showLeaderboard();

// Refresh the shared leaderboard every 30 seconds.
setInterval(showLeaderboard, 30000);

const timerInterval = setInterval(function() {
    if (timeLeft > 0) timeLeft--;

    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(timerInterval);
        gameOver = true;
        cheese.style.display = "none";
        document.getElementById("finalScore").textContent = score;
        document.getElementById("messageBox").style.display = "block";
    }
}, 1000);

function eatCheese() {
    if (gameOver) return;

    if (!musicStarted) {
        music.play().catch(function(error) {
            console.log("Music playback unavailable:", error);
        });
        musicStarted = true;
    }

    score++;
    document.getElementById("score").textContent = score;

    const maxX = Math.max(0, window.innerWidth - cheese.offsetWidth);
    const maxY = Math.max(80, window.innerHeight - cheese.offsetHeight);

    cheese.style.left = Math.random() * maxX + "px";
    cheese.style.top =
        (80 + Math.random() * Math.max(0, maxY - 80)) + "px";
    cheese.style.transform = "none";
}

async function saveScore() {
    if (scoreSaved) return;

    const nameField = document.getElementById("playerName");
    const saveBtn = document.getElementById("saveBtn");
    const status = document.getElementById("saveStatus");

    const name = nameField.value.trim().slice(0, 25) || "Customer";

    saveBtn.disabled = true;
    status.textContent = "Saving score...";

    try {
        await dbRequest(SCORES_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify({
                player_name: name,
                score: score
            })
        });

        scoreSaved = true;
        status.textContent = "✅ Score saved to the global leaderboard!";
        saveBtn.textContent = "Saved!";
        await showLeaderboard();
    } catch (error) {
        console.error("Save score error:", error);
        status.textContent =
            "Couldn't save. Check Supabase table and permissions.";
        saveBtn.disabled = false;
    }
}

function playAgain() {
    location.reload();
}
</script>

</body>
</html>
